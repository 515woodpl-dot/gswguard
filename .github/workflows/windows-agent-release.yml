name: Windows agent release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained agent
        shell: pwsh
        run: |
          dotnet publish apps/windows-agent/GSWGuard.Agent/GSWGuard.Agent.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -o publish
          Copy-Item scripts/install-windows-agent.ps1 publish/install-windows-agent.ps1
          Copy-Item scripts/update-windows-agent.ps1 publish/update-windows-agent.ps1
          Copy-Item scripts/YorGuardIntegrity.ps1 publish/YorGuardIntegrity.ps1
          Set-Content publish/version.txt "${env:GITHUB_REF_NAME}" -NoNewline
          Compress-Archive -Path publish/* -DestinationPath yorguard-windows-agent.zip

      - name: Publish enrollment helper
        shell: pwsh
        run: |
          dotnet publish apps/windows-agent/YorGuard.Enroll/YorGuard.Enroll.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -o enroll-publish
          Copy-Item enroll-publish/YorGuardEnroll.exe publish/YorGuardEnroll.exe

      - name: Build MSI
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart('v')
          dotnet build apps/windows-installer/YorGuard.Agent.Installer.wixproj `
            -c Release -p:ProductVersion=$version `
            -p:AgentPublishDir="$PWD\publish" `
            -p:EnrollPublishDir="$PWD\enroll-publish"
          $msi = Get-ChildItem apps/windows-installer/bin -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) { throw "WiX build did not produce an MSI." }
          Copy-Item $msi.FullName YorGuardAgent.msi

      - name: Sign MSI with Authenticode
        shell: pwsh
        env:
          MSI_SIGNING_PFX_B64: ${{ secrets.MSI_SIGNING_PFX_B64 }}
          MSI_SIGNING_PFX_PASSWORD: ${{ secrets.MSI_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:MSI_SIGNING_PFX_B64) -or [string]::IsNullOrWhiteSpace($env:MSI_SIGNING_PFX_PASSWORD)) {
            throw "MSI signing secrets are not configured. Refusing to publish an unsigned MSI."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "yorguard-msi-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MSI_SIGNING_PFX_B64))
          try {
            & signtool.exe sign /fd SHA256 /f $pfxPath /p $env:MSI_SIGNING_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 YorGuardAgent.msi
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
            & signtool.exe verify /pa /all YorGuardAgent.msi
            if ($LASTEXITCODE -ne 0) { throw "signtool verification failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      # Publish a manifest (version + package hash) and a detached RSA-SHA256
      # signature over it. Endpoints verify the signature against a pinned public
      # key, so trust is anchored to the key rather than to the release URL.
      # Signing is mandatory: a release without the key configured fails here.
      - name: Create signed integrity manifest
        shell: pwsh
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_SIGNING_PRIVATE_KEY)) {
            throw "RELEASE_SIGNING_PRIVATE_KEY secret is not set. Configure the signing key before tagging a release."
          }

          $hash = (Get-FileHash yorguard-windows-agent.zip -Algorithm SHA256).Hash.ToLower()
          $version = "${env:GITHUB_REF_NAME}"
          $manifest = "version=$version`nsha256=$hash`nfile=yorguard-windows-agent.zip`n"
          Set-Content -Path manifest.txt -Value $manifest -NoNewline -Encoding ascii

          # The channel pointer lets an installed agent discover that a newer
          # release exists. It is fetched from a mutable URL
          # (releases/latest/download/channel.txt), so it is signed with the same
          # key; the agent then builds immutable per-version URLs from the
          # version it names.
          $issuedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $channel = "version=$version`nissued_at=$issuedAt`n"
          Set-Content -Path channel.txt -Value $channel -NoNewline -Encoding ascii

          # Sign with built-in .NET RSA. The secret is a base64 PKCS#8 private key.
          $privDer = [Convert]::FromBase64String($env:RELEASE_SIGNING_PRIVATE_KEY)
          $rsa = [System.Security.Cryptography.RSA]::Create()
          try {
            $read = 0
            $rsa.ImportPkcs8PrivateKey($privDer, [ref]$read)
            foreach ($pair in @(
              @{ In = "manifest.txt"; Out = "manifest.sig" },
              @{ In = "channel.txt";  Out = "channel.sig"  }
            )) {
              $bytes = [System.IO.File]::ReadAllBytes($pair.In)
              $sig = $rsa.SignData(
                $bytes,
                [System.Security.Cryptography.HashAlgorithmName]::SHA256,
                [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
              Set-Content -Path $pair.Out -Value ([Convert]::ToBase64String($sig)) -NoNewline -Encoding ascii
            }
          } finally {
            $rsa.Dispose()
          }
          Write-Host "Signed manifest and channel pointer for $version (sha256=$hash)"

      - name: Publish GitHub release
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            yorguard-windows-agent.zip \
            YorGuardAgent.msi \
            publish/version.txt \
            manifest.txt \
            manifest.sig \
            channel.txt \
            channel.sig \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
