minimum_pre_commit_version: "3.6.0"
default_language_version:
  python: python3
repos:
  - repo: local
    hooks:
      - id: gswguard-doc-validation
        name: Validate GSWGuard documentation
        entry: node scripts/validate-docs.mjs
        language: system
        pass_filenames: false
        stages: [pre-commit]
