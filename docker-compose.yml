services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.local
    ports:
      - "8000:8000"
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    command: ["node", "server.js"]
    env_file: .env.local
    ports:
      - "3000:3000"
    depends_on:
      - api
